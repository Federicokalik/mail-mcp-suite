name: mail-mcp

# Every service reads the same .env. What distinguishes one service from another
# — its port, its bearer token, the secret paths it may resolve — is pinned in
# each `environment:` block instead, which takes precedence over `env_file`.
# That keeps the operator's file free of identity settings that must not drift,
# and free of any credential path that could be turned into an inline password.

x-security: &security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 100
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-config: &config
  env_file:
    - path: .env
      required: true

services:
  reader:
    <<: [*security, *config]
    image: ${MAIL_MCP_IMAGE:-mail-mcp-suite:local}
    command: ["node", "dist/reader/index.js"]
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3333"
      MCP_TOKEN_FILE: /run/secrets/reader_mcp_token
      IMAP_PASSWORD_FILE: /run/secrets/imap_password
      MCP_ALLOWED_HOSTS: ${READER_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CHARACTER_LIMIT: ${READER_CHARACTER_LIMIT:-30000}
      CLOUDFLARE_ACCESS_AUD: ${READER_ACCESS_AUD:-}
    secrets:
      - reader_mcp_token
      - imap_password
    ports:
      - "${MAIL_MCP_BIND_ADDRESS:-127.0.0.1}:3333:3333"
    networks:
      - egress
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  actions:
    <<: [*security, *config]
    image: ${MAIL_MCP_IMAGE:-mail-mcp-suite:local}
    command: ["node", "dist/actions/index.js"]
    environment:
      NODE_OPTIONS: --max-old-space-size=128
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3334"
      MCP_TOKEN_FILE: /run/secrets/actions_mcp_token
      QUEUE_API_TOKEN_FILE: /run/secrets/queue_api_token
      # Actions is never addressed from outside; the proxy in front of it is.
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,actions
      WORKER_INTERNAL_URL: http://worker:7337
      CHARACTER_LIMIT: ${ACTIONS_CHARACTER_LIMIT:-20000}
    secrets:
      - actions_mcp_token
      - queue_api_token
    networks:
      - control
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 192m
    cpus: 0.50
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3334/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  actions-proxy:
    <<: [*security, *config]
    image: ${MAIL_MCP_IMAGE:-mail-mcp-suite:local}
    command: ["node", "dist/proxy/index.js"]
    environment:
      NODE_OPTIONS: --max-old-space-size=64
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: "3334"
      PROXY_TARGET: http://actions:3334
      PROXY_TIMEOUT_MS: "30000"
      MCP_TOKEN_FILE: /run/secrets/actions_mcp_token
      CLOUDFLARE_ACCESS_AUD: ${ACTIONS_ACCESS_AUD:-}
    secrets:
      - actions_mcp_token
    ports:
      - "${MAIL_MCP_BIND_ADDRESS:-127.0.0.1}:3334:3334"
    networks:
      - control
      - egress
    tmpfs:
      - /tmp:size=8m,mode=1777
    mem_limit: 96m
    cpus: 0.25
    depends_on:
      actions:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3334/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: [*security, *config]
    image: ${MAIL_MCP_IMAGE:-mail-mcp-suite:local}
    command: ["node", "dist/worker/index.js"]
    environment:
      NODE_OPTIONS: --max-old-space-size=192
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: "7337"
      QUEUE_API_TOKEN_FILE: /run/secrets/queue_api_token
      APPROVAL_SECRET_FILE: /run/secrets/approval_secret
      APPROVAL_CSRF_SECRET_FILE: /run/secrets/approval_csrf_secret
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      MOVE_IMAP_PASSWORD_FILE: /run/secrets/imap_password
      SENT_IMAP_PASSWORD_FILE: /run/secrets/imap_password
    secrets:
      - queue_api_token
      - approval_secret
      - approval_csrf_secret
      - smtp_password
      - imap_password
    ports:
      - "${MAIL_MCP_BIND_ADDRESS:-127.0.0.1}:7337:7337"
    networks:
      - control
      - egress
    volumes:
      - outbox:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7337/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  control:
    internal: true
  egress: {}

volumes:
  outbox: {}

secrets:
  reader_mcp_token:
    file: ${MAIL_MCP_CONFIG_DIR:-./local-config}/secrets/reader_mcp_token
  actions_mcp_token:
    file: ${MAIL_MCP_CONFIG_DIR:-./local-config}/secrets/actions_mcp_token
  queue_api_token:
    file: ${MAIL_MCP_CONFIG_DIR:-./local-config}/secrets/queue_api_token
  approval_secret:
    file: ${MAIL_MCP_CONFIG_DIR:-./local-config}/secrets/approval_secret
  approval_csrf_secret:
    file: ${MAIL_MCP_CONFIG_DIR:-./local-config}/secrets/approval_csrf_secret
  imap_password:
    file: ${MAIL_MCP_CONFIG_DIR:-./local-config}/secrets/imap_password
  smtp_password:
    file: ${MAIL_MCP_CONFIG_DIR:-./local-config}/secrets/smtp_password
