<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Approval</title>
    <!--
      Same design tokens as the worker's browser approval page, deliberately duplicated rather
      than fetched: this file is inlined into a single bundle and rendered inside the host's
      sandboxed iframe, where no external stylesheet, font or image can be loaded.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f0f9ff;
        --surface: #ffffff;
        --inset: #f6fbff;
        --fg: #0c4a6e;
        --fg-muted: #46708a;
        --border: #bae6fd;
        --primary: #0369a1;
        --on-primary: #ffffff;
        --danger: #b91c1c;
        --ring: #0369a1;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1620;
          --surface: #10212e;
          --inset: #0e1c27;
          --fg: #e3f2fb;
          --fg-muted: #93b4c8;
          --border: #1e3a4c;
          --primary: #38bdf8;
          --on-primary: #06202e;
          --danger: #f87171;
          --ring: #38bdf8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1rem;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.55;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.15rem;
        line-height: 1.3;
        margin: 0 0 0.75rem;
      }
      h2 {
        font-size: 0.85rem;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--fg-muted);
        margin: 1.25rem 0 0.5rem;
      }
      p {
        margin: 0 0 1rem;
      }
      a {
        color: var(--primary);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1rem;
        margin: 0 0 1rem;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.5rem 1.25rem;
        margin: 0;
      }
      dt {
        font-weight: 600;
        color: var(--fg-muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 30rem) {
        dl {
          grid-template-columns: 1fr;
          gap: 0.15rem;
        }
        dd {
          margin-bottom: 0.6rem;
        }
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0 0 1rem;
        padding: 1rem;
        border-radius: 0.6rem;
        background: var(--inset);
        border: 1px solid var(--border);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.9rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 0;
        font-size: 0.92rem;
      }
      th,
      td {
        text-align: left;
        vertical-align: top;
        padding: 0.55rem;
        border-bottom: 1px solid var(--border);
        overflow-wrap: anywhere;
      }
      .warning {
        border-left: 0.25rem solid var(--danger);
        padding-left: 0.9rem;
        margin: 0 0 1rem;
      }
      .notice {
        color: var(--fg-muted);
        font-size: 0.92rem;
        margin: 0 0 1rem;
      }
      .fallback {
        border: 1px dashed var(--border);
        border-radius: 0.6rem;
        padding: 0.85rem;
        margin: 0 0 1rem;
        color: var(--fg-muted);
        font-size: 0.92rem;
      }
      .fallback p {
        margin: 0 0 0.5rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      input {
        width: 100%;
        max-width: 22rem;
        min-height: 2.75rem;
        padding: 0.6rem 0.7rem;
        border: 1px solid var(--border);
        border-radius: 0.45rem;
        background: var(--surface);
        color: var(--fg);
        font: inherit;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      button {
        min-height: 2.75rem;
        padding: 0.7rem 1.15rem;
        border-radius: 0.45rem;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        transition:
          background-color 150ms ease-out,
          color 150ms ease-out;
      }
      button[disabled] {
        opacity: 0.5;
        cursor: progress;
      }
      .approve {
        border: 1px solid var(--primary);
        background: var(--primary);
        color: var(--on-primary);
      }
      .cancel {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      .error {
        color: var(--danger);
        font-weight: 600;
      }
      .scroll {
        overflow-x: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
