<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Approval</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 1rem;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 0.75rem;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.45rem 1rem;
        margin: 0 0 1rem;
      }
      dt {
        font-weight: 700;
        opacity: 0.75;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 1rem;
        border-radius: 0.6rem;
        background: rgba(127, 127, 127, 0.14);
        margin: 0 0 1rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 0 0 1rem;
        font-size: 0.92rem;
      }
      th,
      td {
        text-align: left;
        vertical-align: top;
        padding: 0.55rem;
        border-bottom: 1px solid rgba(127, 127, 127, 0.3);
        overflow-wrap: anywhere;
      }
      .warning {
        border-left: 0.3rem solid #c98b00;
        padding-left: 0.8rem;
        margin: 0 0 1rem;
      }
      .error {
        color: #d33;
        font-weight: 700;
      }
      form {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
      }
      input {
        padding: 0.65rem;
        flex: 1 1 14rem;
        min-width: 0;
      }
      button {
        border: 0;
        border-radius: 0.45rem;
        padding: 0.7rem 1rem;
        cursor: pointer;
        font: inherit;
      }
      button[disabled] {
        opacity: 0.6;
        cursor: progress;
      }
      .approve {
        background: #16833b;
        color: white;
      }
      .cancel {
        background: #a52a2a;
        color: white;
      }
      .scroll {
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
